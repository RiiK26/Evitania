name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake

      - name: Build Evitania
        run: ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Evitania-v${{ steps.get_version.outputs.version }}
          path: |
            build/release/Evitania.dll
            build/release/injector.exe
            scripts/run.sh
            scripts/run.bat
