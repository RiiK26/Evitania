name: "CodeQL Analysis"

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install MinGW-w64 Toolchain (C/C++)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Project for CodeQL Tracking (C/C++)
        if: matrix.language == 'c-cpp'
        run: ./scripts/build release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          upload-database: false
          output: results

      - name: Filter Vendor Warnings from SARIF
        run: |
          python3 -c "
          import json, glob, os

          ignored_prefixes = (
              'src/Modules/ImGui/',
              'src/Modules/MinHook/',
              'src/Modules/Il2CppResolver/',
          )

          sarif_files = glob.glob('results/*.sarif')
          for sf in sarif_files:
              with open(sf, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              modified = False
              for run in data.get('runs', []):
                  orig_results = run.get('results', [])
                  filtered_results = []
                  for r in orig_results:
                      is_vendor = False
                      for loc in r.get('locations', []):
                          uri = loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                          norm_uri = uri.replace(chr(92), '/')
                          if any(norm_uri.startswith(p) or f'/{p}' in norm_uri for p in ignored_prefixes):
                              is_vendor = True
                              break
                      if not is_vendor:
                          filtered_results.append(r)

                  if len(filtered_results) != len(orig_results):
                      diff = len(orig_results) - len(filtered_results)
                      run['results'] = filtered_results
                      modified = True
                      print(f'[+] Filtered {diff} vendor alert(s) from {sf}')

              if modified:
                  with open(sf, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2)
          "

      - name: Upload Filtered SARIF to GitHub Code Scanning
        if: "!github.event.repository.private"
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results
          category: "/language:${{ matrix.language }}"

      - name: Render CodeQL Findings in Summary
        if: always()
        run: |
          python3 -c "
          import json, glob, os

          sarif_files = glob.glob('results/*.sarif')
          if not sarif_files:
              print('[+] No SARIF files found.')
              exit(0)

          summary_lines = []
          summary_lines.append('### CodeQL Analysis Report (${{ matrix.language }})')

          total_issues = 0
          for sf in sarif_files:
              with open(sf) as f:
                  data = json.load(f)
              for run in data.get('runs', []):
                  results = run.get('results', [])
                  total_issues += len(results)
                  if not results:
                      summary_lines.append('✅ **0 security vulnerabilities or code defects detected.**')
                  else:
                      summary_lines.append(f'⚠️ **Found {len(results)} potential issue(s):**\n')
                      summary_lines.append('| Severity | Rule ID | Description | Location |')
                      summary_lines.append('|---|---|---|---|')
                      for r in results[:20]:
                          rule_id = r.get('ruleId', 'N/A')
                          level = r.get('level', 'warning')
                          msg = r.get('message', {}).get('text', '').replace('\n', ' ')[:80]
                          locs = r.get('locations', [])
                          loc_str = 'N/A'
                          if locs:
                              phys = locs[0].get('physicalLocation', {})
                              uri = phys.get('artifactLocation', {}).get('uri', '')
                              line = phys.get('region', {}).get('startLine', 0)
                              loc_str = f'{uri}:{line}'
                          summary_lines.append(f'| {level} | \`{rule_id}\` | {msg} | \`{loc_str}\` |')

          summary_text = '\n'.join(summary_lines)
          print(summary_text)

          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as f:
                  f.write(summary_text + '\n\n')
          "

      - name: Upload SARIF Report (for Private Repositories)
        if: github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: codeql-report-${{ matrix.language }}
          path: results/*.sarif
          retention-days: 7
