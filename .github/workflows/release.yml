name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake zip jq

      - name: Build Evitania
        run: ./scripts/build

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r .version config.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          FOLDER_NAME="Evitania v$VERSION"
          mkdir -p "release_pkg/$FOLDER_NAME"
          cp build/release/Evitania.dll "release_pkg/$FOLDER_NAME/"
          cp build/release/injector.exe "release_pkg/$FOLDER_NAME/"
          cp scripts/run.sh "release_pkg/$FOLDER_NAME/"
          cp scripts/run.bat "release_pkg/$FOLDER_NAME/"
          cp resources/template/README.md "release_pkg/$FOLDER_NAME/README.md"
          cd release_pkg
          zip -r ../Evitania-v$VERSION.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: Evitania-v${{ steps.get_version.outputs.version }}.zip
          name: v${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
