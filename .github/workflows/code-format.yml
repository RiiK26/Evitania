name: Code Formatting Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.hpp"
      - "**.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  format-check:
    name: Code Formatting (C/C++ & Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check Python Code Formatting (Ruff)
        id: ruff_check
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff
          : > "$RUNNER_TEMP/ruff_failed_files.txt"
          set +e
          OUTPUT=$(ruff format --check resources/Tools/*.py 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTPUT" | sed -n 's/^Would reformat: //p' > "$RUNNER_TEMP/ruff_failed_files.txt"
            exit "$STATUS"
          fi
          echo "[+] Python code formatting verified via Ruff."

      - name: Check C/C++ Code Formatting (clang-format)
        id: clang_check
        if: always()
        run: |
          pip install --quiet clang-format==23.1.5
          CLANG_FORMAT="$(python3 -c 'import os, sys; print(os.path.join(os.path.dirname(sys.executable), "clang-format"))')"
          "$CLANG_FORMAT" --version
          : > "$RUNNER_TEMP/clang_failed_files.txt"
          FAILED=0
          while IFS= read -r file; do
            if ! "$CLANG_FORMAT" --dry-run --Werror --Wno-error=unknown "$file"; then
              echo "$file" >> "$RUNNER_TEMP/clang_failed_files.txt"
              FAILED=1
            fi
          done < <(git ls-files '*.cpp' '*.hpp' '*.h' | grep -vE 'src/Modules/(ImGui|MinHook|Il2CppResolver)/')
          if [ "$FAILED" -ne 0 ]; then
            echo "[-] C/C++ formatting violations found in:"
            cat "$RUNNER_TEMP/clang_failed_files.txt"
            exit 1
          fi
          echo "[+] C/C++ code formatting verified against .clang-format."

      - name: Automatically Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v 9.0.0
        if: always()
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const tag = "<!-- evitania-code-format-bot -->";
            const isRuffOk = "${{ steps.ruff_check.outcome }}" === "success";
            const isClangOk = "${{ steps.clang_check.outcome }}" === "success";
            const isSuccess = isRuffOk && isClangOk;

            const readList = (filename) => {
              const p = path.join(process.env.RUNNER_TEMP || "/tmp", filename);
              if (!fs.existsSync(p)) return [];
              return fs
                .readFileSync(p, "utf8")
                .split(/\r?\n/)
                .map((s) => s.trim())
                .filter(Boolean);
            };

            const clangFailed = readList("clang_failed_files.txt");
            const ruffFailed = readList("ruff_failed_files.txt");

            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const issueNumber = context.issue.number || context.payload.pull_request.number;

            let body = "";
            if (isSuccess) {
              body = `${tag}\n### Code Formatting Check: Passed ✅\n\nAll modified code meets the project's formatting standards!\n\n- **C/C++ (\`.clang-format\`)**: Passed\n- **Python (\`ruff format\`)**: Passed\n\n[View Run Details](${runUrl})`;
            } else {
              let failureDetails = [];
              if (!isClangOk) {
                if (clangFailed.length > 0) {
                  const fileList = clangFailed.map((f) => `  - \`${f}\``).join("\n");
                  failureDetails.push(
                    `- **C/C++**: Found style violations against \`.clang-format\` in ${clangFailed.length} file(s):\n${fileList}`
                  );
                } else {
                  failureDetails.push("- **C/C++**: Found style violations against \`.clang-format\`");
                }
              }
              if (!isRuffOk) {
                if (ruffFailed.length > 0) {
                  const fileList = ruffFailed.map((f) => `  - \`${f}\``).join("\n");
                  failureDetails.push(
                    `- **Python**: Found style violations against \`ruff format\` in ${ruffFailed.length} file(s):\n${fileList}`
                  );
                } else {
                  failureDetails.push("- **Python**: Found style violations against \`ruff format\`");
                }
              }

              const fixCmds = [];
              if (!isClangOk) {
                fixCmds.push(
                  "# Format C/C++ files:\n" +
                    (clangFailed.length > 0
                      ? `clang-format -i ${clangFailed.join(" ")}`
                      : "git ls-files '*.cpp' '*.hpp' '*.h' | grep -vE 'src/Modules/(ImGui|MinHook|Il2CppResolver)/' | xargs clang-format -i")
                );
              }
              if (!isRuffOk) {
                fixCmds.push(
                  "# Format Python files:\n" +
                    (ruffFailed.length > 0
                      ? `ruff format ${ruffFailed.join(" ")}`
                      : "ruff format resources/Tools/*.py")
                );
              }

              body = `${tag}\n### Code Formatting Check: Failed ❌\n\n${failureDetails.join("\n")}\n\n#### How to fix locally:\n\`\`\`bash\n${fixCmds.join("\n\n")}\n\`\`\`\n\nPlease apply formatting, commit, and push your updates to this PR branch.\n\n[View Detailed Error Log](${runUrl})`;
            }

            // Check if comment already exists to avoid duplicate comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const existingComment = comments.data.find(c => c.body && c.body.includes(tag));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

      - name: Enforce Check Status
        if: always()
        run: |
          if [ "${{ steps.ruff_check.outcome }}" != "success" ] || [ "${{ steps.clang_check.outcome }}" != "success" ]; then
            echo "[-] Formatting checks failed. Please see the PR comment and job logs."
            exit 1
          fi
          echo "[+] All formatting checks passed successfully."
